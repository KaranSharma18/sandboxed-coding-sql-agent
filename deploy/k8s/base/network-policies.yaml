# Default deny, then only the flows the design needs (see docs/architecture.md, trust zones).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {}, podSelector: {matchLabels: {k8s-app: kube-dns}}}]
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-ingress}
spec:
  podSelector: {matchLabels: {app: fixloop-api}}
  policyTypes: [Ingress]
  ingress: [{ports: [{port: 8080}]}]
---
# Control plane (api, worker, publisher): datastores inside the cluster, HTTPS outside
# (Gemini for the worker, GitHub for the publisher, customer webhooks).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: control-plane-egress}
spec:
  podSelector:
    matchExpressions: [{key: app, operator: In, values: [fixloop-api, fixloop-worker, fixloop-publisher]}]
  policyTypes: [Egress]
  egress:
    - ports: [{port: 5432}, {port: 6379}, {port: 443}, {port: 9000}]
---
# The runner reaches only Redis and the object store; sandboxes have no network at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: runner-egress}
spec:
  podSelector: {matchLabels: {app: fixloop-runner}}
  policyTypes: [Egress]
  egress:
    - ports: [{port: 6379}, {port: 443}, {port: 9000}]
---
# The package proxy: reachable from runner hosts, and allowed to reach PyPI over HTTPS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: pkgproxy}
spec:
  podSelector: {matchLabels: {app: fixloop-pkgproxy}}
  policyTypes: [Ingress, Egress]
  ingress: [{ports: [{port: 8080}]}]
  egress: [{ports: [{port: 443}]}]
