apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fixloop
resources:
  - namespace.yaml
  - config.yaml
  - migrate-job.yaml
  - api.yaml
  - worker.yaml
  - runner.yaml
  - publisher.yaml
  - pkgproxy.yaml
  - network-policies.yaml
images:
  - name: fixloop-services
    newName: ghcr.io/fixloop/fixloop-services
    newTag: latest
