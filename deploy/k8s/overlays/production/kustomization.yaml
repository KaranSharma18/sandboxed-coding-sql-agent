apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
images:
  - name: fixloop-services
    newName: ghcr.io/fixloop/fixloop-services
    newTag: v0.1.0   # pin a released, signed tag (or digest) in production
patches:
  - target: {kind: Deployment, name: api}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 3}
