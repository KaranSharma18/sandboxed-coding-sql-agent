apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
namespace: fixloop-staging
patches:
  - target: {kind: ConfigMap, name: fixloop-config}
    patch: |-
      - {op: replace, path: /data/FIXLOOP_ENV, value: staging}
      - {op: replace, path: /data/FIXLOOP_STORAGE__BUCKET, value: fixloop-staging}
  - target: {kind: Deployment, name: worker}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
