[project]
name = "fixloop-eval"
version = "0.1.0"
description = "Evaluation harness for Fixloop: suites, gold checks, replay and reports"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    # Only the client: the harness talks to a Fixloop API like any other user would.
    "fixloop-client",
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
fixloop-eval = "fixloop_eval.cli:app"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixloop_eval"]
