[project]
name = "fixloop-sqlexec"
version = "0.1.0"
description = "Runs inside SQL sandboxes: builds snapshot databases and executes guarded, read-only queries for Fixloop"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "duckdb>=1.1",
    "psycopg[binary]>=3.2",
]

[project.scripts]
fixloop-sqlexec = "fixloop_sqlexec.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixloop_sqlexec"]
