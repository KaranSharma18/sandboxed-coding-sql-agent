[project]
name = "fixloop-runner"
version = "0.1.0"
description = "Fixloop sandbox runner: the only component that starts containers"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fixloop-core",
    # The local backend copies these into its tools folder; the Docker images ship their own copy.
    "fixloop-pytest",
    "fixloop-sqlexec",
    "docker>=7.1",
    "typer>=0.15",
]

[project.scripts]
fixloop-runner = "fixloop_runner.main:app"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixloop_runner"]
