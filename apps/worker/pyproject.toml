[project]
name = "fixloop-worker"
version = "0.1.0"
description = "Fixloop worker: claims tasks and runs the bounded plan-execute-verify loop"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["fixloop-core"]

[project.scripts]
fixloop-worker = "fixloop_worker.main:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fixloop_worker"]
