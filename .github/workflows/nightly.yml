name: nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-contract:
    runs-on: ubuntu-latest
    env:
      FIXLOOP_GEMINI__API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HAS_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --frozen
      - name: live model contract tests (every role returns schema-valid output)
        if: env.HAS_KEY == 'true'
        run: uv run pytest -m live -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --frozen
      - name: dependency audit
        run: uvx pip-audit --strict -r <(uv export --frozen --all-packages --no-hashes --no-emit-workspace)
        shell: bash
