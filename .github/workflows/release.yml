name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write  # keyless cosign signing

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: services, file: images/services/Dockerfile, image: ghcr.io/${{ github.repository_owner }}/fixloop-services, args: ""}
          - {name: python-3.10, file: images/sandbox/python/Dockerfile, image: ghcr.io/${{ github.repository_owner }}/sbx-python, tag: "3.10", args: "PYTHON_VERSION=3.10"}
          - {name: python-3.11, file: images/sandbox/python/Dockerfile, image: ghcr.io/${{ github.repository_owner }}/sbx-python, tag: "3.11", args: "PYTHON_VERSION=3.11"}
          - {name: python-3.12, file: images/sandbox/python/Dockerfile, image: ghcr.io/${{ github.repository_owner }}/sbx-python, tag: "3.12", args: "PYTHON_VERSION=3.12"}
          - {name: python-3.13, file: images/sandbox/python/Dockerfile, image: ghcr.io/${{ github.repository_owner }}/sbx-python, tag: "3.13", args: "PYTHON_VERSION=3.13"}
          - {name: sql-duckdb, file: images/sandbox/duckdb/Dockerfile, image: ghcr.io/${{ github.repository_owner }}/sbx-duckdb, tag: "2", args: ""}
          - {name: sql-postgres, file: images/sandbox/postgres/Dockerfile, image: ghcr.io/${{ github.repository_owner }}/sbx-postgres, tag: "16", args: ""}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.args }}
          tags: ${{ matrix.image }}:${{ matrix.tag || github.ref_name }}
          sbom: true
          provenance: true
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "${{ matrix.image }}@${{ steps.build.outputs.digest }}"
      - run: echo "${{ matrix.name }} ${{ matrix.image }}@${{ steps.build.outputs.digest }}" > digest-${{ matrix.name }}.txt
      - uses: actions/upload-artifact@v4
        with: {name: "digest-${{ matrix.name }}", path: "digest-${{ matrix.name }}.txt"}

  lockfile:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: "digest-*", merge-multiple: true}
      - run: cat digest-*.txt | grep -v '^services ' | sort > images.lock && cat images.lock
      - uses: softprops/action-gh-release@v2
        with: {files: images.lock}
